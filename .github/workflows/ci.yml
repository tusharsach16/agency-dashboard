name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend: typecheck, migrate & test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency
          POSTGRES_DB: agency_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations against CI Postgres
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://agency:agency@localhost:5432/agency_dashboard?schema=public

      - name: Seed database for test suites
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://agency:agency@localhost:5432/agency_dashboard?schema=public

      - name: Typecheck backend
        run: npm run typecheck

      # Note: ESLint is not currently configured in backend. Add an .eslintrc/eslint.config.js and 'npm run lint' step here when ready.

      - name: Run backend test suites
        run: npm test
        env:
          DATABASE_URL: postgresql://agency:agency@localhost:5432/agency_dashboard?schema=public
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-32-chars-long
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-32-chars-long
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 4000
          CLIENT_ORIGIN: http://localhost:5173
          NODE_ENV: test

  frontend:
    name: "Frontend: typecheck & build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      # Note: ESLint is not currently configured in frontend. Add an .eslintrc/eslint.config.js and 'npm run lint' step here when ready.

      - name: Build frontend production bundle
        run: npm run build
